/* Full-viewport gameplay: no page scrolling on phones in either orientation */
html,body{width:100%;height:100%;overscroll-behavior:none}
body:has(#turn:not(.hidden)),body:has(#play:not(.hidden)){overflow:hidden;height:100dvh}
body:has(#turn:not(.hidden)) main,body:has(#play:not(.hidden)) main{height:100dvh;min-height:0;overflow:hidden;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-left))}
body:has(#turn:not(.hidden)) .top,body:has(#play:not(.hidden)) .top{flex:0 0 auto;padding:2px 0 0}
body:has(#turn:not(.hidden)) .top h1,body:has(#play:not(.hidden)) .top h1{font-size:clamp(18px,3.6vh,30px);margin:2px}
body:has(#turn:not(.hidden)) .top .sub,body:has(#play:not(.hidden)) .top .sub{display:none}
body:has(#turn:not(.hidden)) .foot,body:has(#play:not(.hidden)) .foot{display:none}
#turn{flex:1;min-height:0;display:flex;flex-direction:column;margin:5px auto 0;padding:clamp(7px,1.2vh,12px);overflow:hidden}
#turn .playerbar{flex:0 0 auto;padding:clamp(3px,.7vh,7px);font-size:clamp(12px,2vh,16px)}
#turn .playerbar strong{font-size:clamp(15px,2.5vh,21px)}
#turn .stage{flex:1;min-height:0;justify-content:space-evenly}
#turn .dicezone{flex:0 1 auto;min-height:0}
#turn .scene{height:clamp(105px,25dvh,195px);width:clamp(120px,29dvh,210px);margin:0;perspective:750px}
#turn .cube{width:clamp(80px,16dvh,112px);height:clamp(80px,16dvh,112px)}
#turn .face:nth-child(1){transform:translateZ(calc(clamp(80px,16dvh,112px)/2))}
#turn .face:nth-child(2){transform:rotateY(180deg) translateZ(calc(clamp(80px,16dvh,112px)/2))}
#turn .face:nth-child(3){transform:rotateY(90deg) translateZ(calc(clamp(80px,16dvh,112px)/2))}
#turn .face:nth-child(4){transform:rotateY(-90deg) translateZ(calc(clamp(80px,16dvh,112px)/2))}
#turn .face:nth-child(5){transform:rotateX(90deg) translateZ(calc(clamp(80px,16dvh,112px)/2))}
#turn .face:nth-child(6){transform:rotateX(-90deg) translateZ(calc(clamp(80px,16dvh,112px)/2))}
#turn .face{padding:clamp(8px,1.7dvh,13px);border-radius:16px}
#turn .pip{width:clamp(12px,2.4dvh,17px);height:clamp(12px,2.4dvh,17px)}
#turn .dice-result{font-size:clamp(30px,7dvh,58px);line-height:1.05;min-height:1.05em;margin:0 0 4px;color:#ffdf61;text-shadow:0 3px 0 #9c4c18,0 5px 14px #0009;font-variant-numeric:tabular-nums}
#turn .diceactions{width:min(100%,320px)}
#turn .diceactions .primary{font-size:clamp(13px,2.5dvh,18px);padding:clamp(7px,1.3dvh,12px)}
#turn .choices-wrap{flex:0 0 auto;margin-top:clamp(5px,1dvh,10px);padding:clamp(6px,1.1dvh,12px);box-shadow:0 4px 0 #a66a3e}
#turn .choices-wrap h3{font-size:clamp(13px,2.4dvh,19px);margin:0 0 5px}
#turn .choices{gap:6px}
#turn .choice{padding:clamp(4px,1dvh,10px) 2px;border-radius:14px;font-size:clamp(10px,1.9dvh,15px)}
#turn .choice .symbol{font-size:clamp(19px,4.5dvh,34px);margin:0}
#turn .stats{display:none}
#play{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
#play .card{flex:0 1 auto;min-height:0;margin:4px auto 8px;display:flex;flex-direction:column;max-height:calc(100% - 62px)}
#play .art{min-height:0;flex:1;overflow:hidden}
#play .emoji{font-size:clamp(55px,18dvh,145px)}
#play .cardhead{padding:clamp(5px,1vh,12px);font-size:clamp(14px,2.5dvh,20px)}
#play .word{padding:clamp(4px,1vh,10px);font-size:clamp(21px,4dvh,34px)}
#play .instruction{padding:5px;margin:0 10px 8px;font-size:clamp(11px,2dvh,15px)}
#play .primary{flex:0 0 auto;padding:clamp(8px,1.5dvh,14px)}
#play>.hint{display:none}
@media(orientation:landscape){
 #turn .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:clamp(5px,2vw,16px);align-items:center}
 #turn .dicezone{height:100%;justify-content:center}
 #turn .scene{height:clamp(85px,30dvh,170px);width:clamp(105px,34dvh,180px)}
 #turn .cube{width:clamp(68px,21dvh,104px);height:clamp(68px,21dvh,104px)}
 #turn .face:nth-child(1){transform:translateZ(calc(clamp(68px,21dvh,104px)/2))}
 #turn .face:nth-child(2){transform:rotateY(180deg) translateZ(calc(clamp(68px,21dvh,104px)/2))}
 #turn .face:nth-child(3){transform:rotateY(90deg) translateZ(calc(clamp(68px,21dvh,104px)/2))}
 #turn .face:nth-child(4){transform:rotateY(-90deg) translateZ(calc(clamp(68px,21dvh,104px)/2))}
 #turn .face:nth-child(5){transform:rotateX(90deg) translateZ(calc(clamp(68px,21dvh,104px)/2))}
 #turn .face:nth-child(6){transform:rotateX(-90deg) translateZ(calc(clamp(68px,21dvh,104px)/2))}
 #turn .dice-result{font-size:clamp(25px,9dvh,45px)}
 #turn .choices-wrap{margin:0}
 #turn .choices{grid-template-columns:repeat(3,minmax(0,1fr))}
 #turn .choice{font-size:clamp(10px,2.8dvh,15px);padding:clamp(5px,2dvh,13px) 2px}
 #turn .choice .symbol{font-size:clamp(18px,7dvh,36px)}
 #play .card{width:min(65vw,450px)}
 #play .emoji{font-size:clamp(48px,23dvh,115px)}
}
@media(max-height:560px) and (orientation:portrait){#turn .scene{height:19dvh}#turn .cube{width:70px;height:70px}#turn .face:nth-child(1){transform:translateZ(35px)}#turn .face:nth-child(2){transform:rotateY(180deg) translateZ(35px)}#turn .face:nth-child(3){transform:rotateY(90deg) translateZ(35px)}#turn .face:nth-child(4){transform:rotateY(-90deg) translateZ(35px)}#turn .face:nth-child(5){transform:rotateX(90deg) translateZ(35px)}#turn .face:nth-child(6){transform:rotateX(-90deg) translateZ(35px)}}

function draw(k){if(rolling)return;if(used[k].length>=CARDS[k].length)used[k]=[];const available=CARDS[k].map((_,i)=>i).filter(i=>!used[k].includes(i));const i=available[Math.floor(Math.random()*available.length)];used[k].push(i);save();const item=CARDS[k][i];$('card').className='card '+k;$('cardhead').textContent=META[k].name;$('emoji').textContent=item.e;$('word').textContent=item.t;$('instruction').textContent=META[k].instruction;show('play')}
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>draw(b.dataset.color));$('done').onclick=()=>{current=(current+1)%players.length;persist();turnStart()};$('newGame').onclick=()=>{if(confirm('Νέο παιχνίδι; Οι χρησιμοποιημένες κάρτες θα παραμείνουν αποθηκευμένες.')){players=[];current=0;count=2;try{localStorage.removeItem(PKEY)}catch(e){}setupFields();show('setup')}};$('reset').onclick=()=>{if(confirm('Να ξαναμπούν όλες οι κάρτες στις τράπουλες;')){used={blue:[],green:[],red:[]};save();stats()}};
try{const s=JSON.parse(localStorage.getItem(PKEY));if(s&&Array.isArray(s.players)&&s.players.length>=2&&s.players.length<=6){players=s.players;current=Number.isInteger(s.current)&&s.current>=0&&s.current<players.length?s.current:0;count=players.length}}catch(e){}makeCube();setupFields();if(players.length)turnStart();else show('setup');

// Persistent theme selection; first visit starts in the minimal theme.
(function(){
 var themeKey='paidiki-parastasi-theme-v1';
 var allowed=['simple','stage','nature','magic'];
 function setTheme(name){
  if(allowed.indexOf(name)<0)name='simple';
  document.body.setAttribute('data-theme',name);
  document.querySelectorAll('[data-theme-choice]').forEach(function(btn){btn.setAttribute('aria-pressed',String(btn.getAttribute('data-theme-choice')===name));});
  try{localStorage.setItem(themeKey,name)}catch(e){}
 }
 var initial='simple';try{initial=localStorage.getItem(themeKey)||'simple'}catch(e){}
 setTheme(initial);
 var dialog=document.getElementById('themeDialog');
 document.getElementById('openThemes').addEventListener('click',function(){dialog.classList.remove('hidden')});
 document.getElementById('closeThemes').addEventListener('click',function(){dialog.classList.add('hidden')});
 dialog.addEventListener('click',function(e){if(e.target===dialog)dialog.classList.add('hidden')});
 document.querySelectorAll('[data-theme-choice]').forEach(function(btn){btn.addEventListener('click',function(){setTheme(btn.getAttribute('data-theme-choice'));dialog.classList.add('hidden')})});
 document.getElementById('restartFromSettings').addEventListener('click',function(){
   if(!confirm('Επιστροφή στην αρχική οθόνη; Θα ξεκινήσει νέο παιχνίδι και θα μηδενιστούν οι χρησιμοποιημένες κάρτες. Το θέμα εμφάνισης θα διατηρηθεί.'))return;
   try{localStorage.removeItem(PKEY);localStorage.removeItem(KEY)}catch(e){}
   location.reload();
 });
})();
</script></body></html>
